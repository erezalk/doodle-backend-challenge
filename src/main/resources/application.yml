spring:
  application:
    name: doodle-backend-challenge
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:doodle}
    username: ${DB_USERNAME:doodle}
    password: ${DB_PASSWORD:doodle}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
