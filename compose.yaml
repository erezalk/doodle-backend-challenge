services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${DB_NAME:-doodle}
      POSTGRES_USER: ${DB_USERNAME:-doodle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-doodle}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Containers reach the database by service name on its internal port. DB_HOST and DB_PORT
      # from .env are for running the application outside Docker, so they are not used here.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-doodle}
      DB_USERNAME: ${DB_USERNAME:-doodle}
      DB_PASSWORD: ${DB_PASSWORD:-doodle}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  postgres-data:
